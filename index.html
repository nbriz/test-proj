<!DOCTYPE html>
<html lang="en-US">
  <head>
    <!-- your metadata goes here in the "head" -->
    <title>New Cool Title</title>
    <meta name="author" content="Your Name">
    <meta name="description" content="What's this page about?">
    <link rel="icon" href="images/favicon.png">

    <!-- metadata for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="images/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- "open graph" metadata for social media posts -->
    <meta property="og:title" content="Test Proj">
    <meta property="og:description" content="video test">
    <meta property="og:image" content="https://website.com/images/splash.png">
    <meta property="og:url" content="https://website.com">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="styles.css">

  </head>
  <body>
    <!-- you page's content goes here in the body -->
    <h1>Welcome to My Page!</h1>

    <p>
      I'm so glad you're here!
    </p>
    
    <video src="video/screen-saver.mp4" controls></video>

    <nav>
      <a href="https://netizen.org">some other page</a>
      <a href="https://developer.mozilla.org">yet another page</a>
    </nav>
    
    <button id="click">jump</button>
    
    <script>
      document.querySelector('#click')
        .addEventListener('click', () => {
          const v = document.querySelector('video')
          v.currentTime = 6
          console.log(v.currentTime)
        })
    </script>

  </body>
</html>
